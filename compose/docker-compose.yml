# Chủ đề G: Ba miền tin cậy (DMZ → APP → DATA)
name: atht-topic-g

networks:
  net_dmz:
    driver: bridge
    internal: false
  net_app:
    driver: bridge
    internal: true
  net_data:
    driver: bridge
    internal: true

services:
  dmz-web:
    image: nginx:1.27-alpine@sha256:a5127daff3d6f4606be3100a252419bfa84fd6ee5cd74d0feaca1a5068f97dcf
    container_name: dmz-web
    networks:
      net_dmz:
        aliases: [dmz-web]
    volumes:
      - ../config/dmz-web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/dmz-web/html:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

  gateway-dmz-app:
    image: nginx:1.27-alpine@sha256:a5127daff3d6f4606be3100a252419bfa84fd6ee5cd74d0feaca1a5068f97dcf
    container_name: gateway-dmz-app
    networks:
      net_dmz: {aliases: [gateway-dmz-app]}
      net_app: {aliases: [gateway-dmz-app]}
    volumes:
      - ../config/gateway-dmz-app/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

  app-api:
    build:
      context: ../config/app-api
      dockerfile: Dockerfile
    image: atht-app-api:1.0
    container_name: app-api
    networks:
      net_app: {aliases: [app-api]}
    environment:
      DB_HOST: gateway-app-data
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: lab_password_change_me
      BIND_PORT: "5000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on: [gateway-app-data, data-db]

  gateway-app-data:
    build:
      context: ../config/gateway-app-data
      dockerfile: Dockerfile
    image: atht-gateway-app-data:1.0
    container_name: gateway-app-data
    networks:
      net_app: {aliases: [gateway-app-data]}
      net_data: {aliases: [gateway-app-data]}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on: [data-db]

  data-db:
    image: postgres:16-alpine@sha256:8bfa8786de771893582a9a489b67775a51693f4e7408fbd251d843769cf87691
    container_name: data-db
    networks:
      net_data: {aliases: [data-db]}
    volumes:
      - ../config/data-db/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../config/data-db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../config/data-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../config/data-db/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: lab_password_change_me
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    tmpfs: [/var/lib/postgresql/data, /var/run/postgresql, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  probe:
    image: alpine:3.20
    container_name: probe
    profiles: [test]
    networks:
      net_dmz: {aliases: [probe-dmz]}
      net_app: {aliases: [probe-app]}
      net_data: {aliases: [probe-data]}
    command: ["sleep", "infinity"]
    cap_add: [NET_RAW]
