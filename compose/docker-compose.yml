# Chủ đề G: Ba miền tin cậy (DMZ → APP → DATA)
name: atht-topic-g

networks:
  net_dmz:
    driver: bridge
    internal: false
  net_app:
    driver: bridge
    internal: true
  net_data:
    driver: bridge
    internal: true

services:
  dmz-web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: dmz-web
    networks:
      net_dmz:
        aliases: [dmz-web]
    volumes:
      - ../config/dmz-web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../config/dmz-web/html:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs: [/var/run, /tmp]
    security_opt: [no-new-privileges:true]
    # nginx master chạy root: cần CHOWN (thư mục tạm) + SETUID/SETGID (hạ quyền worker).
    # Cổng 8080/8000 > 1024 nên KHÔNG cần NET_BIND_SERVICE.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    restart: unless-stopped
    depends_on: [gateway-dmz-app]

  gateway-dmz-app:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: gateway-dmz-app
    networks:
      net_dmz: {aliases: [gateway-dmz-app]}
      net_app: {aliases: [gateway-dmz-app]}
    volumes:
      - ../config/gateway-dmz-app/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs: [/var/run, /tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    restart: unless-stopped
    # nginx resolve "app-api" ngay lúc khởi động -> app-api phải tồn tại trước
    depends_on: [app-api]

  app-api:
    build:
      context: ../config/app-api
      dockerfile: Dockerfile
    image: atht-app-api:1.0
    container_name: app-api
    networks:
      net_app: {aliases: [app-api]}
    environment:
      DB_HOST: gateway-app-data
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: lab_password_change_me
      BIND_PORT: "5000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on: [gateway-app-data, data-db]

  gateway-app-data:
    build:
      context: ../config/gateway-app-data
      dockerfile: Dockerfile
    image: atht-gateway-app-data:1.0
    container_name: gateway-app-data
    networks:
      net_app: {aliases: [gateway-app-data]}
      net_data: {aliases: [gateway-app-data]}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    depends_on: [data-db]

  data-db:
    build:
      context: ../config/data-db
      dockerfile: Dockerfile
    image: atht-data-db:1.0
    container_name: data-db
    networks:
      net_data: {aliases: [data-db]}
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: lab_password_change_me
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    tmpfs:
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700
      - /var/run/postgresql
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE]
    restart: unless-stopped

  probe:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    container_name: probe
    profiles: [test]
    networks:
      net_dmz: {aliases: [probe-dmz]}
      net_app: {aliases: [probe-app]}
      net_data: {aliases: [probe-data]}
    command: ["sleep", "infinity"]
    cap_add: [NET_RAW]