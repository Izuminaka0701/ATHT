worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 128;
}

http {
    server_tokens off;

    # Cổng kiểm soát DMZ→APP: chỉ proxy /health và /data
    server {
        listen 8000;
        server_name _;

        # Ngoại lệ 1: health check từ DMZ
        location /health {
            proxy_pass http://app-api:5000/health;
            proxy_connect_timeout 3s;
        }

        # Ngoại lệ 2: truy vấn dữ liệu qua API (app sẽ gọi DB qua gateway-app-data)
        location /data {
            proxy_pass http://app-api:5000/data;
            proxy_connect_timeout 3s;
        }

        # Mặc định: từ chối mọi path khác
        location / {
            return 403;
        }
    }
}
